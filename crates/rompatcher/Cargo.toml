[package]
name = "romhacks"
version = "0.1.0"
edition = "2024"
description = "Easy ROM hack patching and auditing."

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.3.21", features = ["derive"] }
fs-err = "3.1.0"
kdl = "6.3.4"
kdl-schema = "0.1.0"
kdl-schema-check = "0.1.0"
log = "0.4.20"
miette = { version = "3.3.0", features = ["fancy"] }
patch-ips = { path = "../patch-ips" }
patch-bps = { path = "../patch-bps" }
patch-ppf = { path = "../patch-ppf" }
patch-ups = { path = "../patch-ups" }
patch-vcd = { path = "../patch-vcd" }
polonius-the-crab = "0.4.2"
pretty_env_logger = "0.5.0"
read-write-hashers = { path = "../read-write-hashers" }
read-write-utils = { path = "../read-write-utils" }
regex-lite = "0.1.0"
rompatcher-crc32-utils = { path = "../rompatcher-crc32-utils" }
thiserror = "2.0.12"
ulid = "1.2.1"
url = "2.4.0"
